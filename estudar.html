<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QEnemSocial · Praticar questões do ENEM</title>

  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2E1065" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="has-chat">
  <header class="app-header">
    <div class="container header-inner">
      <h1 class="app-title">
        <a href="/">
          <img src="images/logotipo.png" alt="QEnemSocial" class="logo-img" />
        </a>
      </h1>

      <div class="filters">
        <div class="filter-field">
          <label for="year-select">Ano</label>
          <select id="year-select"></select>
        </div>
        <div class="filter-field">
          <label for="discipline-select">Disciplina</label>
          <select id="discipline-select"></select>
        </div>
        <div class="filter-actions">
          <button id="load-btn" class="btn btn-primary">Praticar</button>
          <button id="simulado-btn" class="btn btn-outline">Simulado</button>
        </div>
      </div>
    </div>
  </header>

  <section class="stats-bar container">
    <div class="stat">
      <span class="stat-value" id="stat-correct">0</span>
      <span class="stat-label">Acertos</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-wrong">0</span>
      <span class="stat-label">Erros</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-accuracy">0%</span>
      <span class="stat-label">Aproveitamento</span>
    </div>
    <button id="reset-stats-btn" class="btn-link">Zerar</button>
  </section>

  <main class="container">
    <p id="status-area" class="status hidden"></p>

    <section id="question-area" class="question-card hidden">
      <div class="question-meta">
        <span id="q-number"></span>
        <span id="q-discipline" class="badge"></span>
      </div>

      <div class="progress-bar">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>

      <p id="q-intro" class="q-intro"></p>
      <p id="q-context" class="q-context"></p>

      <div id="q-alternatives" class="alternatives"></div>

      <p id="q-feedback" class="feedback hidden"></p>

      <div class="question-actions">
        <button id="answer-btn" class="btn btn-primary btn-block">Responder</button>
        <div class="nav-row">
          <button id="prev-btn" class="btn btn-ghost">← Anterior</button>
          <span id="progress" class="progress-text"></span>
          <button id="next-btn" class="btn btn-ghost">Próxima →</button>
        </div>
      </div>
    </section>

    <section id="results-area" class="question-card results-panel hidden">
      <h2>Resultado do simulado</h2>
      <div id="results-summary"></div>
      <button id="back-to-practice-btn" class="btn btn-primary btn-block">Voltar</button>
    </section>
  </main>

  <div id="chat-sheet" class="chat-sheet">
    <div class="chat-header">
      <span class="chat-title">Pepito</span>
      <span id="chat-usage" class="chat-usage">0/10 mensagens</span>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" autocomplete="off" placeholder="Carregue uma questão para conversar..." disabled />
      <button id="chat-send-btn" type="submit" class="btn btn-primary" disabled>Enviar</button>
    </form>
  </div>

  <button
    type="button"
    id="chat-tab"
    class="chat-tab"
    aria-expanded="false"
    aria-controls="chat-sheet"
    aria-label="Arrastar ou abrir o chat do Pepito"
  >
    <span class="chat-wave" aria-hidden="true"></span>
    <span id="chat-toggle-icon" class="chat-toggle-icon" aria-hidden="true">⌃</span>
  </button>

  <script src="js/config.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/admin-shortcut.js"></script>
</body>
</html>
